<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="calculator-body">
        <nav>
            <img src="ellipsis_icon" class="menu" alt="ellipsis icon">
        </nav>
        <input type="number" class="input" value="0">
        <div class="keypad-container">
            <div class="container text-center">
                <div class="row row-cols-4">
                <div class="col"><button class="circle-button ash">AC</button></div>
                <div class="col"><button class="circle-button ash">+/_</button></div>
                <div class="col"><button class="circle-button ash">%</button></div>
                <div class="col"><button class="circle-button orange">÷</button></div>
                </div>
            </div>
            <div class="container text-center">
                <div class="row row-cols-4">
                <div class="col"><button class="circle-button gray">7</button></div>
                <div class="col"><button class="circle-button gray">8</button></div>
                <div class="col"><button class="circle-button gray">9</button></div>
                <div class="col"><button class="circle-button orange">X</button></div>
                </div>
            </div>
            <div class="container text-center">
                <div class="row row-cols-4">
                <div class="col"><button class="circle-button gray">4</button></div>
                <div class="col"><button class="circle-button gray">5</button></div>
                <div class="col"><button class="circle-button gray">6</button></div>
                <div class="col"><button class="circle-button orange">-</button></div>
                </div>
            </div>
            <div class="container text-center">
                <div class="row row-cols-4">
                <div class="col"><button class="circle-button gray">1</button></div>
                <div class="col"><button class="circle-button gray">2</button></div>
                <div class="col"><button class="circle-button gray">3</button></div>
                <div class="col"><button class="circle-button orange">+</button></div>
                </div>
            </div>
            <div class="container text-center">
                <div class="row row-cols-4">
                <div class="col"><button class="circle-button gray"><img src="calculator_icon.png" class="calculator-icon"></button></div>
                <div class="col"><button class="circle-button gray">0</button></div>
                <div class="col"><button class="circle-button gray">.</button></div>
                <div class="col"><button class="circle-button orange">=</button></div>
                </div>
            </div>
        </div>    
    </div>     
</body>
</html>
